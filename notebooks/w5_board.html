<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Week 5 Board + Week 4 Recap</title>
<style>
  * { box-sizing: border-box; }
  body { font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--foreground); }
  .wrap { max-width: 760px; }
  h1 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .sub { color: var(--muted-foreground); font-size: 11.5px; margin: 0 0 16px; }
  .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
         color: var(--muted-foreground); margin: 20px 0 8px; font-weight:700; }
  .pos { margin-bottom: 16px; }
  .pos h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
            color: var(--muted-foreground); margin: 0 0 6px; display:flex; gap:8px; align-items:baseline; }
  .pos h2 .n { font-size: 10px; font-weight: 500; opacity:.7; letter-spacing:0; text-transform:none; }
  .row { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: center; margin: 3px 0; }
  .rank { text-align:right; color: var(--muted-foreground); font-size: 11px; font-variant-numeric: tabular-nums; }
  .cell { position: relative; }
  .bar { height: 24px; border-radius: 5px; background: color-mix(in srgb, var(--accent) 46%, transparent);
         border: 1px solid color-mix(in srgb, var(--accent) 58%, transparent); min-width: 2px; }
  .lab { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); display:flex;
         align-items:center; gap:8px; white-space:nowrap; }
  .name { font-weight: 600; font-size: 12px; }
  .team { color: var(--muted-foreground); font-size: 10.5px; font-weight:500; }
  .opp { color: var(--muted-foreground); font-size: 10.5px; font-weight:500; }
  .pts { position:absolute; right:8px; top:50%; transform:translateY(-50%);
         font-variant-numeric: tabular-nums; font-weight:700; font-size:12px; }
  .top .bar { background: color-mix(in srgb, var(--accent) 50%, transparent);
              border-color: color-mix(in srgb, var(--accent) 66%, transparent); }
  .pill { font-size:9px; font-weight:700; letter-spacing:.04em; padding:1px 5px; border-radius:4px;
          background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .card { border:1px solid var(--border); border-radius:8px; background: var(--card);
          padding: 10px 12px; margin: 6px 0; }
  .card .hd { font-size:12px; font-weight:700; margin-bottom:6px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .kpi { display:flex; align-items:baseline; gap:6px; }
  .kpi .v { font-size:20px; font-weight:800; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size:11px; color: var(--muted-foreground); }
  .good { color: var(--accent); }
  .note { color: var(--muted-foreground); font-size: 11px; border-top: 1px solid var(--border);
          padding-top: 10px; margin-top: 14px; }
  .note b { color: var(--foreground); }
  table { width:100%; border-collapse: collapse; font-size: 11.5px; }
  th, td { text-align:left; padding:3px 6px; font-variant-numeric: tabular-nums; }
  th { color: var(--muted-foreground); font-weight:600; }
  td.r { text-align:right; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const OFF = {
  "QB": [
    {rank:1,name:"Josh Allen",team:"BUF",pts:21.64},{rank:2,name:"Dak Prescott",team:"DAL",pts:21.6},
    {rank:3,name:"Jared Goff",team:"DET",pts:20.07},{rank:4,name:"Drake Maye",team:"NE",pts:19.97},
    {rank:5,name:"Brock Purdy",team:"SF",pts:19.79},{rank:6,name:"Matthew Stafford",team:"LA",pts:19.36},
    {rank:7,name:"Jacoby Brissett",team:"ARI",pts:18.63},{rank:8,name:"C.J. Stroud",team:"HOU",pts:18.55},
    {rank:9,name:"Jayden Daniels",team:"WAS",pts:17.92},{rank:10,name:"Caleb Williams",team:"CHI",pts:17.79}
  ],
  "RB": [
    {rank:1,name:"Jahmyr Gibbs",team:"DET",pts:19.9},{rank:2,name:"Bijan Robinson",team:"ATL",pts:17.93},
    {rank:3,name:"Javonte Williams",team:"DAL",pts:16.6},{rank:4,name:"James Cook",team:"BUF",pts:16.33},
    {rank:5,name:"Kyren Williams",team:"LA",pts:16.07},{rank:6,name:"Ashton Jeanty",team:"LV",pts:15.06},
    {rank:7,name:"Christian McCaffrey",team:"SF",pts:14.53},{rank:8,name:"Jonathan Taylor",team:"IND",pts:14.51},
    {rank:9,name:"Derrick Henry",team:"BAL",pts:14.39},{rank:10,name:"Jaylen Warren",team:"PIT",pts:14.0}
  ],
  "WR": [
    {rank:1,name:"CeeDee Lamb",team:"DAL",pts:13.58},{rank:2,name:"Michael Wilson",team:"ARI",pts:11.87},
    {rank:3,name:"Amon-Ra St. Brown",team:"DET",pts:11.77},{rank:4,name:"Davante Adams",team:"LA",pts:11.57},
    {rank:5,name:"Chris Olave",team:"NO",pts:11.42},{rank:6,name:"Puka Nacua",team:"LA",pts:11.34},
    {rank:7,name:"Tee Higgins",team:"CIN",pts:10.31},{rank:8,name:"Jaxon Smith-Njigba",team:"SEA",pts:10.31},
    {rank:9,name:"Alec Pierce",team:"IND",pts:10.28},{rank:10,name:"Parker Washington",team:"JAX",pts:10.24}
  ],
  "TE": [
    {rank:1,name:"Trey McBride",team:"ARI",pts:9.36},{rank:2,name:"Sam LaPorta",team:"DET",pts:9.12},
    {rank:3,name:"Brenton Strange",team:"JAX",pts:8.48},{rank:4,name:"Dalton Schultz",team:"HOU",pts:8.33},
    {rank:5,name:"Tyler Higbee",team:"LA",pts:8.28},{rank:6,name:"Mike Gesicki",team:"CIN",pts:8.01},
    {rank:7,name:"Dalton Kincaid",team:"BUF",pts:7.9},{rank:8,name:"Juwan Johnson",team:"NO",pts:7.83},
    {rank:9,name:"Brock Bowers",team:"LV",pts:7.74},{rank:10,name:"Colston Loveland",team:"CHI",pts:7.36}
  ]
};
const DEF = [{"team":"HOU","opp":"TEN","pa":15.5,"dst":8.4},{"team":"JAX","opp":"PHI","pa":17.0,"dst":8.4},{"team":"CIN","opp":"MIA","pa":18.0,"dst":5.4},{"team":"NYJ","opp":"CLE","pa":18.5,"dst":5.4},{"team":"WAS","opp":"NYG","pa":18.5,"dst":5.4},{"team":"DEN","opp":"LAC","pa":19.0,"dst":5.4},{"team":"DAL","opp":"TB","pa":19.5,"dst":5.4},{"team":"MIN","opp":"NO","pa":19.5,"dst":5.4},{"team":"ATL","opp":"BAL","pa":20.2,"dst":5.4},{"team":"NE","opp":"LV","pa":21.0,"dst":5.4},{"team":"CLE","opp":"NYJ","pa":21.0,"dst":5.4},{"team":"PIT","opp":"IND","pa":21.0,"dst":5.4},{"team":"SEA","opp":"SF","pa":21.2,"dst":5.4},{"team":"CHI","opp":"GB","pa":21.5,"dst":5.4},{"team":"NO","opp":"MIN","pa":22.0,"dst":5.4},{"team":"LAC","opp":"DEN","pa":22.5,"dst":5.4},{"team":"TEN","opp":"HOU","pa":23.0,"dst":5.4},{"team":"NYG","opp":"WAS","pa":23.0,"dst":5.4},{"team":"BAL","opp":"ATL","pa":23.2,"dst":4.4},{"team":"IND","opp":"PIT","pa":23.5,"dst":4.4},{"team":"GB","opp":"CHI","pa":24.0,"dst":4.4},{"team":"SF","opp":"SEA","pa":24.2,"dst":4.4},{"team":"PHI","opp":"JAX","pa":24.5,"dst":4.4},{"team":"MIA","opp":"CIN","pa":24.5,"dst":4.4},{"team":"LV","opp":"NE","pa":24.5,"dst":4.4},{"team":"DET","opp":"ARI","pa":24.5,"dst":4.4},{"team":"LA","opp":"BUF","pa":25.8,"dst":4.4},{"team":"BUF","opp":"LA","pa":28.8,"dst":4.4},{"team":"TB","opp":"DAL","pa":29.0,"dst":4.4},{"team":"ARI","opp":"DET","pa":30.0,"dst":4.4}];

// Week 4 recap (from holdout_score.json / holdout_score_def.json)
const W4 = {
  off: { n:338, model:{mae:4.867,rmse:6.818,rho:0.7861}, last:{mae:5.946,rho:0.6842}, tr3:{mae:4.989,rho:0.7533} },
  def: { n:32, rho:0.378, gap:2.69, top5:[3,6,7,13,20], top5mean:7.80, restmean:5.11,
         board_top5:[["MIN","MIA",9.0],["SEA","LAC",9.0],["BAL","TEN",6.0],["GB","TB",11.0],["PIT","CLE",4.0]] },
  trend: { w1:0.6824, w2:0.7589, w3:0.7856, w4:0.7861 }
};

const maxOff = Math.max(...Object.values(OFF).flat().map(d=>d.pts));
const maxDst = Math.max(...DEF.map(d=>d.dst));
const app = document.getElementById('app');

const offBlocks = Object.entries(OFF).map(([pos, rows]) => {
  const body = rows.map(d => {
    const w = Math.max(2, (d.pts/maxOff)*100);
    const top = d.rank<=1 ? ' top' : '';
    return `<div class="row${top}"><div class="rank">${d.rank}</div>
      <div class="cell"><div class="bar" style="width:${w}%"></div>
      <div class="lab"><span class="name">${d.name}</span><span class="team">${d.team}</span></div>
      <div class="pts">${d.pts.toFixed(1)}</div></div></div>`;
  }).join('');
  return `<div class="pos"><h2>${pos}<span class="n">top 10</span></h2>${body}</div>`;
}).join('');

const defBody = DEF.map((d,i) => {
  const w = Math.max(6, (d.dst/maxDst)*100);
  const top = i<5 ? ' top' : '';
  const pill = i<5 ? '<span class="pill">PICK</span>' : '';
  return `<div class="row${top}"><div class="rank">${i+1}</div>
    <div class="cell"><div class="bar" style="width:${w}%"></div>
    <div class="lab"><span class="name">${d.team}</span><span class="opp">vs ${d.opp} &middot; ${d.pa} imp</span>${pill}</div>
    <div class="pts">${d.dst.toFixed(1)}</div></div></div>`;
}).join('');

const t = W4.trend;
app.innerHTML = `
<h1>2026 &mdash; Week 5 Board <span style="opacity:.55;font-weight:500">+ Week 4 recap</span></h1>
<div class="sub">ESPN Standard (non-PPR) &middot; offense logged pre-kickoff 2026-10-08 16:05 &middot; 442 players / 30 D/ST (2 byes)</div>

<div class="sec">How we did in Week 4</div>
<div class="grid">
  <div class="card">
    <div class="hd">Offense (n=${W4.off.n})</div>
    <div class="kpi"><span class="v good">+${W4.off.model.rho.toFixed(3)}</span><span class="l">model Spearman</span></div>
    <table style="margin-top:6px"><tr><th></th><th class="r">MAE</th><th class="r">&rho;</th></tr>
      <tr><td><b>Model</b></td><td class="r">${W4.off.model.mae.toFixed(2)}</td><td class="r">${W4.off.model.rho.toFixed(3)}</td></tr>
      <tr><td>trailing-3</td><td class="r">${W4.off.tr3.mae.toFixed(2)}</td><td class="r">${W4.off.tr3.rho.toFixed(3)}</td></tr>
      <tr><td>last game</td><td class="r">${W4.off.last.mae.toFixed(2)}</td><td class="r">${W4.off.last.rho.toFixed(3)}</td></tr>
    </table>
    <div class="sub" style="margin:6px 0 0">Model wins on ranking (beats tr3 &amp; last-game on &rho;; lowest MAE vs last-game). Trend: w1 ${t.w1.toFixed(3)} &rarr; w2 ${t.w2.toFixed(3)} &rarr; w3 ${t.w3.toFixed(3)} &rarr; <b>w4 ${t.w4.toFixed(3)}</b> (peaked, holding).</div>
  </div>
  <div class="card">
    <div class="hd">D/ST (n=${W4.def.n})</div>
    <div class="kpi"><span class="v good">+${W4.def.gap.toFixed(2)}</span><span class="l">top-5 vs rest gap</span></div>
    <div class="sub" style="margin:6px 0">&rho; ${W4.def.rho.toFixed(3)} &middot; top-5 actual ranks ${W4.def.top5.join(' / ')}<br/>
    Board top-5: ${W4.def.board_top5.map(x=>x[0]+`(${x[1]} &rarr; ${x[2]}pts)`).join(' &middot; ')}<br/>
    Strong week &mdash; big jump from W3 (gap &minus;1.51, ranks 6/7/20/28/29). The matchup baseline paid off: it ranked MIN/SEA/BAL high and they were the top-5 scorers.</div>
  </div>
</div>

<div class="sec">Week 5 &mdash; Offense (top 10 per position)</div>
${offBlocks}

<div class="sec">Week 5 &mdash; D/ST Board (all 30)</div>
${defBody}

<div class="note">
  <b>Offense:</b> model is the frozen pre-2026 fit (no re-training this week) &mdash; logged from the scheduled-panel path, same as W1&ndash;4. QBs lead because ESPN standard rewards dual-threat passing volume (Allen/Prescott/Goff top-3).
  <br><br>
  <b>D/ST method (shipped, A/B'd):</b> rank by the OPPONENT&rsquo;s Vegas implied team total, lowest first &mdash; the matchup, not the team, drives D/ST points. A/B on 2024+25 (2025 clean holdout): Spearman <b>+0.345</b>, beating the best own-defense/turnover model (+0.336). ESPN Standard D/ST tier on projected points allowed (0&ndash;6:+10, 7&ndash;13:+7, 14&ndash;17:+4, 18&ndash;23:+1, 24&ndash;30:0, 31+:&minus;1) + flat league-mean sacks (~2.4) and turnovers (~1.0) &mdash; the latter two set the absolute value, not the ranking.
  <br><br>
  <b>W5 D/ST picks:</b> HOU (vs TEN, 15.5 imp) &amp; JAX (vs PHI, 17.0 imp) top the board &mdash; both face the week&rsquo;s weakest projected offenses. ARI (vs DET, 30.0 imp) is the sit: plays the strongest projected offense of the slate.
  <br><br>
  <b>Holdout status:</b> W5 offense (442) + D/ST (30) logged pre-kickoff &mdash; score with <code>src.holdout</code>/<code>src.holdout_def --week 5 --score</code> after the games.
</div>`;
</script>
</body>
</html>
