<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Week 12 Board + W11 Recap</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --foreground: #f2f6fc; --muted-foreground: #8b99b3; --accent: #4d9fff;
    --border: #243149; --card: #101828;
  }
  body { font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         color: var(--foreground); background: #0a0f1e; margin: 0; padding: 24px 16px; }
  .wrap { max-width: 760px; }
  h1 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .sub { color: var(--muted-foreground); font-size: 11.5px; margin: 0 0 16px; }
  .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
         color: var(--muted-foreground); margin: 20px 0 8px; font-weight:700; }
  .pos { margin-bottom: 16px; }
  .pos h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
            color: var(--muted-foreground); margin: 0 0 6px; display:flex; gap:8px; align-items:baseline; }
  .pos h2 .n { font-size: 10px; font-weight: 500; opacity:.7; letter-spacing:0; text-transform:none; }
  .row { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: center; margin: 3px 0; }
  .rank { text-align:right; color: var(--muted-foreground); font-size: 11px; font-variant-numeric: tabular-nums; }
  .cell { position: relative; }
  .bar { height: 24px; border-radius: 5px; background: color-mix(in srgb, var(--accent) 46%, transparent);
         border: 1px solid color-mix(in srgb, var(--accent) 58%, transparent); min-width: 2px; }
  .lab { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); display:flex;
         align-items:center; gap:8px; white-space:nowrap; }
  .name { font-weight: 600; font-size: 12px; }
  .team { color: var(--muted-foreground); font-size: 10.5px; font-weight:500; }
  .opp { color: var(--muted-foreground); font-size: 10.5px; font-weight:500; }
  .pts { position:absolute; right:8px; top:50%; transform:translateY(-50%);
         font-variant-numeric: tabular-nums; font-weight:700; font-size:12px; }
  .top .bar { background: color-mix(in srgb, var(--accent) 50%, transparent);
              border-color: color-mix(in srgb, var(--accent) 66%, transparent); }
  .pill { font-size:9px; font-weight:700; letter-spacing:.04em; padding:1px 5px; border-radius:4px;
          background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .card { border:1px solid var(--border); border-radius:8px; background: var(--card);
          padding: 10px 12px; margin: 6px 0; }
  .card .hd { font-size:12px; font-weight:700; margin-bottom:6px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .kpi { display:flex; align-items:baseline; gap:6px; }
  .kpi .v { font-size:20px; font-weight:800; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size:11px; color: var(--muted-foreground); }
  .good { color: var(--accent); }
  .note { color: var(--muted-foreground); font-size: 11px; border-top: 1px solid var(--border);
          padding-top: 10px; margin-top: 14px; }
  .note b { color: var(--foreground); }
  table { width:100%; border-collapse: collapse; font-size: 11.5px; }
  th, td { text-align:left; padding:3px 6px; font-variant-numeric: tabular-nums; }
  th { color: var(--muted-foreground); font-weight:600; }
  td.r { text-align:right; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const OFF = {

    {rank:5,name:"Jared Goff",team:"DET",pts:20.67},{rank:6,name:"C.J. Stroud",team:"HOU",pts:20.28},
    {rank:7,name:"Josh Allen",team:"BUF",pts:20.11},{rank:8,name:"Jayden Daniels",team:"WAS",pts:19.74},

    {rank:5,name:"Christian McCaffrey",team:"SF",pts:16.15},{rank:6,name:"Javonte Williams",team:"DAL",pts:16.06},
    {rank:7,name:"Chuba Hubbard",team:"CAR",pts:15.88},{rank:8,name:"Bijan Robinson",team:"ATL",pts:15.85},
    {rank:9,name:"D'Andre Swift",team:"CHI",pts:14.91},{rank:10,name:"Jonah Coleman",team:"DEN",pts:14.45}

    {rank:5,name:"Amon-Ra St. Brown",team:"DET",pts:11.86},{rank:6,name:"Jameson Williams",team:"DET",pts:11.48},
    {rank:7,name:"Jaxon Smith-Njigba",team:"SEA",pts:11.42},{rank:8,name:"Justin Jefferson",team:"MIN",pts:10.74},
    {rank:9,name:"Nico Collins",team:"HOU",pts:10.56},{rank:10,name:"Tee Higgins",team:"CIN",pts:10.53}
  ],
  "TE": [
    {rank:1,name:"Harold Fannin Jr.",team:"CLE",pts:9.12},{rank:2,name:"Isaiah Likely",team:"NYG",pts:8.88},
    {rank:3,name:"George Kittle",team:"SF",pts:8.72},{rank:4,name:"Sam LaPorta",team:"DET",pts:8.67},
    {rank:5,name:"Travis Kelce",team:"KC",pts:8.44},{rank:6,name:"Dalton Kincaid",team:"BUF",pts:8.28},
    {rank:7,name:"Colston Loveland",team:"CHI",pts:8.13},{rank:8,name:"T.J. Hockenson",team:"MIN",pts:8.01},
    {rank:9,name:"Dallas Goedert",team:"PHI",pts:7.99},{rank:10,name:"Tucker Kraft",team:"GB",pts:7.82}
  ]
};
const DEF = [{"team":"DEN","opp":"PIT","pa":16.5,"dst":8.4},{"team":"NE","opp":"LAC","pa":17.0,"dst":8.4},{"team":"MIN","opp":"ATL","pa":17.2,"dst":5.4},{"team":"WAS","opp":"ARI","pa":17.2,"dst":5.4},{"team":"JAX","opp":"TEN","pa":17.5,"dst":5.4},{"team":"CLE","opp":"LV","pa":17.5,"dst":5.4},{"team":"NYG","opp":"IND","pa":17.8,"dst":5.4},{"team":"NYJ","opp":"MIA","pa":18.0,"dst":5.4},{"team":"LAC","opp":"NE","pa":18.5,"dst":5.4},{"team":"DAL","opp":"PHI","pa":19.5,"dst":5.4},{"team":"CIN","opp":"NO","pa":19.8,"dst":5.4},{"team":"PIT","opp":"DEN","pa":20.0,"dst":5.4},{"team":"TB","opp":"CAR","pa":20.2,"dst":5.4},{"team":"LA","opp":"GB","pa":20.5,"dst":5.4},{"team":"HOU","opp":"BAL","pa":20.5,"dst":5.4},{"team":"SF","opp":"SEA","pa":21.0,"dst":5.4},{"team":"BUF","opp":"KC","pa":21.8,"dst":5.4},{"team":"LV","opp":"CLE","pa":22.0,"dst":5.4},{"team":"MIA","opp":"NYJ","pa":22.5,"dst":5.4},{"team":"GB","opp":"LA","pa":23.0,"dst":5.4},{"team":"CAR","opp":"TB","pa":23.2,"dst":4.4},{"team":"SEA","opp":"SF","pa":23.5,"dst":4.4},{"team":"IND","opp":"NYG","pa":23.8,"dst":4.4},{"team":"ATL","opp":"MIN","pa":24.2,"dst":4.4},{"team":"ARI","opp":"WAS","pa":24.2,"dst":4.4},{"team":"KC","opp":"BUF","pa":24.8,"dst":4.4},{"team":"CHI","opp":"DET","pa":27.0,"dst":4.4},{"team":"BAL","opp":"HOU","pa":27.0,"dst":4.4},{"team":"PHI","opp":"DAL","pa":28.0,"dst":4.4},{"team":"DET","opp":"CHI","pa":28.5,"dst":4.4},{"team":"NO","opp":"CIN","pa":29.8,"dst":4.4},{"team":"TEN","opp":"JAX","pa":32.0,"dst":3.4}];

// W11 recap (replay-logged + scored 2026-11-25, frozen V6 model)
const RECAP = {
  off: [
    {w:"w11", n:294, mae:3.01, rho:0.729, tr3:0.618, last:0.535}
  ],
  def: [
    {w:"w11", n:26, rho:0.486, gap:6.15, top5:[1,4,5,6,15]}
  ],
  trend: { off: "w1 +0.682 &rarr; w2 +0.759 &rarr; w3 +0.786 &rarr; w4 +0.786 &rarr; w5 +0.727 &rarr; (w6 skipped) &rarr; w7 +0.688 &rarr; w8 +0.678 &rarr; w9 +0.718 &rarr; w10 +0.701 &rarr; <b>w11 +0.729</b>",
           def: "w3 &minus;1.51 &rarr; w4 +2.69 &rarr; w5 +3.96 &rarr; w7 &minus;0.55 &rarr; w8 +7.15 &rarr; w9 +6.72 &rarr; w10 +3.91 &rarr; <b>w11 +6.15</b>" }
};

const maxOff = Math.max(...Object.values(OFF).flat().map(d=>d.pts));
const maxDst = Math.max(...DEF.map(d=>d.dst));
const app = document.getElementById('app');

const offBlocks = Object.entries(OFF).map(([pos, rows]) => {
  const body = rows.map(d => {
    const w = Math.max(2, (d.pts/maxOff)*100);
    const top = d.rank<=1 ? ' top' : '';
    return `<div class="row${top}"><div class="rank">${d.rank}</div>
      <div class="cell"><div class="bar" style="width:${w}%"></div>
      <div class="lab"><span class="name">${d.name}</span><span class="team">${d.team}</span></div>
      <div class="pts">${d.pts.toFixed(1)}</div></div></div>`;
  }).join('');
  return `<div class="pos"><h2>${pos}<span class="n">top 10</span></h2>${body}</div>`;
}).join('');

const defBody = DEF.map((d,i) => {
  const w = Math.max(6, (d.dst/maxDst)*100);
  const top = i<5 ? ' top' : '';
  const pill = i<5 ? '<span class="pill">PICK</span>' : '';
  return `<div class="row${top}"><div class="rank">${i+1}</div>
    <div class="cell"><div class="bar" style="width:${w}%"></div>
    <div class="lab"><span class="name">${d.team}</span><span class="opp">vs ${d.opp} &middot; ${d.pa} imp</span>${pill}</div>
    <div class="pts">${d.dst.toFixed(1)}</div></div></div>`;
}).join('');

const offRows = RECAP.off.map(r =>
  `<tr><td><b>${r.w}</b></td><td class="r">${r.n}</td><td class="r">${r.mae.toFixed(2)}</td>
   <td class="r"><b>${r.rho.toFixed(3)}</b></td><td class="r">${r.tr3.toFixed(3)}</td><td class="r">${r.last.toFixed(3)}</td></tr>`).join('');
const defRows = RECAP.def.map(r =>
  `<tr><td><b>${r.w}</b></td><td class="r">${r.n}</td><td class="r">${r.rho.toFixed(3)}</td>
   <td class="r"><b>+${r.gap.toFixed(2)}</b></td><td class="r">${r.top5.join(' / ')}</td></tr>`).join('');

app.innerHTML = `
<h1>2026 &mdash; Week 12 Board <span style="opacity:.55;font-weight:500">+ W11 recap</span></h1>
<div class="sub">ESPN Standard (non-PPR) &middot; W12 logged pre-kickoff 2026-11-25 21:42 &middot; 892 offense / 32 D/ST &middot; games Nov 25&ndash;30</div>

<div class="sec">Last week, scored (W11, replay-logged + scored 2026-11-25)</div>
<div class="grid">
  <div class="card">
    <div class="hd">Offense &mdash; model vs baselines</div>
    <div class="kpi"><span class="v good">+0.729</span><span class="l">W11 Spearman (n=294)</span></div>
    <table style="margin-top:6px"><tr><th></th><th class="r">n</th><th class="r">MAE</th><th class="r">&rho; model</th><th class="r">&rho; tr3</th><th class="r">&rho; last</th></tr>
      ${offRows}
    </table>
    <div class="sub" style="margin:6px 0 0">W11 is the model's best ranking week of the season: +0.729 vs trailing-3 +0.618 and last-game +0.535, with the lowest MAE (3.01 vs 3.76 / 4.61). Season trend: ${RECAP.trend.off}</div>
  </div>
  <div class="card">
    <div class="hd">D/ST &mdash; matchup board</div>
    <div class="kpi"><span class="v good">+6.15</span><span class="l">W11 top-5 vs rest gap</span></div>
    <table style="margin-top:6px"><tr><th></th><th class="r">n</th><th class="r">&rho; board</th><th class="r">top-5 gap</th><th class="r">top-5 act. ranks</th></tr>
      ${defRows}
    </table>
    <div class="sub" style="margin:6px 0 0">Strong board week: Spearman +0.486, gap +6.15 (top-5 mean 11.20 vs rest 5.05). HOU (board #4, allowed 3, 3 TOs) finished actual rank 1; KC, BUF, DEN landed actual ranks 6/5/4. Only PIT (board #5, allowed 19) missed (actual 15). Gap trend: ${RECAP.trend.def}</div>
  </div>
</div>

<div class="sec">Week 12 &mdash; Offense (top 10 per position)</div>
${offBlocks}

<div class="sec">Week 12 &mdash; D/ST Board (all 32)</div>
${defBody}

<div class="note">
  <b>Offense:</b> frozen pre-2026 model (V6: usage shares + prior-season bridge; retrained 2026-10-22 after the A/B win) &mdash; no re-training this week. W12 logged from the scheduled-panel path at 2026-11-25 21:42. DAL stacks the board again (Prescott QB1, Lamb WR1, Pickens WR4, Williams RB6); DET clusters (Goff QB5, Gibbs RB1, St. Brown WR5, Williams WR6, LaPorta TE4); CIN follows (Burrow QB3, Chase WR3, Higgins WR10).
  <br><br>
  <b>D/ST method (shipped, A/B'd):</b> rank by the OPPONENT&rsquo;s Vegas implied team total, lowest first &mdash; the matchup, not the team, drives D/ST points. A/B on 2024+25 (2025 clean holdout): Spearman <b>+0.345</b>, beating the best own-defense/turnover model (+0.336). ESPN Standard D/ST tier on projected points allowed (0&ndash;6:+10, 7&ndash;13:+7, 14&ndash;17:+4, 18&ndash;23:+1, 24&ndash;30:0, 31+:&minus;1) + flat league-mean sacks (~2.4) and turnovers (~1.0) &mdash; those two set the absolute value, not the ranking.
  <br><br>
  <b>W12 D/ST picks:</b> DEN (16.5 imp, vs PIT) and NE (17.0, vs LAC) top the board alone in the +4 tier; MIN (17.2, vs ATL), WAS (17.2, vs ARI) and JAX (17.5, vs TEN) round out the top-5 in the +1 tier. Sits: TEN (32.0 imp, vs JAX &mdash; the slate&rsquo;s strongest projected offense, &minus;1 tier), NO (29.8, vs CIN), DET (28.5, vs CHI), PHI (28.0, vs DAL), CHI/BAL (27.0, vs DET/HOU).
  <br><br>
  <b>Holdout status:</b> W11 was replay-logged with the frozen V6 model on 2026-11-25 and scored the same day (294 offense / 26 D/ST). W12 offense (892) + D/ST (32) logged pre-kickoff 2026-11-25 21:41&ndash;21:42. One timing note: W12 opens with the GB&ndash;LA Wednesday game (Nov 25, 20:00 ET), which kicked off just before the log timestamp &mdash; the log path uses strictly pre-W12 features (scheduled panel), so no W12 outcome enters any prediction. Score after the games: <code>src.holdout</code> / <code>src.holdout_def --season 2026 --week 12 --score</code>.
</div>`;
</script>
</body>
</html>
