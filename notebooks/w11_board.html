<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Week 11 Board + W8–10 Recap</title>
<style>
  * { box-sizing: border-box; }
  body { font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--foreground); }
  .wrap { max-width: 760px; }
  h1 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .sub { color: var(--muted-foreground); font-size: 11.5px; margin: 0 0 16px; }
  .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
         color: var(--muted-foreground); margin: 20px 0 8px; font-weight:700; }
  .pos { margin-bottom: 16px; }
  .pos h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
            color: var(--muted-foreground); margin: 0 0 6px; display:flex; gap:8px; align-items:baseline; }
  .pos h2 .n { font-size: 10px; font-weight: 500; opacity:.7; letter-spacing:0; text-transform:none; }
  .row { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: center; margin: 3px 0; }
  .rank { text-align:right; color: var(--muted-foreground); font-size: 11px; font-variant-numeric: tabular-nums; }
  .cell { position: relative; }
  .bar { height: 24px; border-radius: 5px; background: color-mix(in srgb, var(--accent) 46%, transparent);
         border: 1px solid color-mix(in srgb, var(--accent) 58%, transparent); min-width: 2px; }
  .lab { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); display:flex;
         align-items:center; gap:8px; white-space:nowrap; }
  .name { font-weight: 600; font-size: 12px; }
  .team { color: var(--muted-foreground); font-size: 10.5px; font-weight:500; }
  .opp { color: var(--muted-foreground); font-size: 10.5px; font-weight:500; }
  .pts { position:absolute; right:8px; top:50%; transform:translateY(-50%);
         font-variant-numeric: tabular-nums; font-weight:700; font-size:12px; }
  .top .bar { background: color-mix(in srgb, var(--accent) 50%, transparent);
              border-color: color-mix(in srgb, var(--accent) 66%, transparent); }
  .pill { font-size:9px; font-weight:700; letter-spacing:.04em; padding:1px 5px; border-radius:4px;
          background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .card { border:1px solid var(--border); border-radius:8px; background: var(--card);
          padding: 10px 12px; margin: 6px 0; }
  .card .hd { font-size:12px; font-weight:700; margin-bottom:6px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .kpi { display:flex; align-items:baseline; gap:6px; }
  .kpi .v { font-size:20px; font-weight:800; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size:11px; color: var(--muted-foreground); }
  .good { color: var(--accent); }
  .note { color: var(--muted-foreground); font-size: 11px; border-top: 1px solid var(--border);
          padding-top: 10px; margin-top: 14px; }
  .note b { color: var(--foreground); }
  table { width:100%; border-collapse: collapse; font-size: 11.5px; }
  th, td { text-align:left; padding:3px 6px; font-variant-numeric: tabular-nums; }
  th { color: var(--muted-foreground); font-weight:600; }
  td.r { text-align:right; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const OFF = {

    {rank:7,name:"Carnell Tate",team:"TEN",pts:10.65},{rank:8,name:"Chris Olave",team:"NO",pts:10.58},
    {rank:9,name:"Parker Washington",team:"JAX",pts:10.43},{rank:10,name:"Keenan Allen",team:"SF",pts:10.27}
  ],

    {rank:3,name:"George Kittle",team:"SF",pts:9.61},{rank:4,name:"Dalton Kincaid",team:"BUF",pts:9.53},

    {rank:7,name:"Sam LaPorta",team:"DET",pts:7.96},{rank:8,name:"Brenton Strange",team:"JAX",pts:7.95},
    {rank:9,name:"Brevyn Spann-Ford",team:"DAL",pts:7.52},{rank:10,name:"Mark Andrews",team:"BAL",pts:7.25}
  ]
};
const DEF = [{"team":"KC","opp":"ARI","pa":12.5,"dst":11.4},{"team":"BUF","opp":"MIA","pa":14.5,"dst":8.4},{"team":"DEN","opp":"LV","pa":15.2,"dst":8.4},{"team":"HOU","opp":"IND","pa":16.5,"dst":8.4},{"team":"PIT","opp":"PHI","pa":17.0,"dst":8.4},{"team":"CHI","opp":"NO","pa":18.5,"dst":5.4},{"team":"LAC","opp":"NYJ","pa":18.8,"dst":5.4},{"team":"DET","opp":"TB","pa":20.0,"dst":5.4},{"team":"JAX","opp":"NYG","pa":20.2,"dst":5.4},{"team":"CAR","opp":"BAL","pa":21.0,"dst":5.4},{"team":"PHI","opp":"PIT","pa":21.5,"dst":5.4},{"team":"NYJ","opp":"LAC","pa":21.8,"dst":5.4},{"team":"SF","opp":"MIN","pa":21.8,"dst":5.4},{"team":"DAL","opp":"TEN","pa":23.0,"dst":5.4},{"team":"CIN","opp":"WAS","pa":23.0,"dst":5.4},{"team":"BAL","opp":"CAR","pa":23.5,"dst":4.4},{"team":"MIN","opp":"SF","pa":24.8,"dst":4.4},{"team":"LV","opp":"DEN","pa":25.2,"dst":4.4},{"team":"NYG","opp":"JAX","pa":26.2,"dst":4.4},{"team":"TB","opp":"DET","pa":26.5,"dst":4.4},{"team":"IND","opp":"HOU","pa":28.0,"dst":4.4},{"team":"ARI","opp":"KC","pa":29.0,"dst":4.4},{"team":"WAS","opp":"CIN","pa":29.5,"dst":4.4},{"team":"NO","opp":"CHI","pa":30.0,"dst":4.4},{"team":"MIA","opp":"BUF","pa":31.0,"dst":3.4},{"team":"TEN","opp":"DAL","pa":31.5,"dst":3.4}];

// W8–W10 recap (replay-logged 2026-11-17, frozen V6 model, scored same day)
const RECAP = {
  off: [
    {w:"w8", n:289, mae:4.28, rho:0.678, tr3:0.644, last:0.576},
    {w:"w9", n:337, mae:3.37, rho:0.718, tr3:0.631, last:0.556},
    {w:"w10",n:299, mae:3.46, rho:0.701, tr3:0.605, last:0.557}
  ],
  def: [
    {w:"w8", n:28, rho:0.226, gap:7.15, top5:[1,3,4,10,21]},
    {w:"w9", n:30, rho:0.630, gap:6.72, top5:[2,5,6,8,9]},
    {w:"w10",n:26, rho:0.501, gap:3.91, top5:[1,6,17,18]}
  ],
  trend: { off: "w1 +0.682 &rarr; w2 +0.759 &rarr; w3 +0.786 &rarr; w4 +0.786 &rarr; w5 +0.727 &rarr; (w6 skipped) &rarr; w7 +0.688 &rarr; w8 +0.678 &rarr; w9 +0.718 &rarr; <b>w10 +0.701</b>",
           def: "w3 &minus;1.51 &rarr; w4 +2.69 &rarr; w5 +3.96 &rarr; w7 &minus;0.55 &rarr; <b>w8 +7.15 &rarr; w9 +6.72 &rarr; w10 +3.91</b>" }
};

const maxOff = Math.max(...Object.values(OFF).flat().map(d=>d.pts));
const maxDst = Math.max(...DEF.map(d=>d.dst));
const app = document.getElementById('app');

const offBlocks = Object.entries(OFF).map(([pos, rows]) => {
  const body = rows.map(d => {
    const w = Math.max(2, (d.pts/maxOff)*100);
    const top = d.rank<=1 ? ' top' : '';
    return `<div class="row${top}"><div class="rank">${d.rank}</div>
      <div class="cell"><div class="bar" style="width:${w}%"></div>
      <div class="lab"><span class="name">${d.name}</span><span class="team">${d.team}</span></div>
      <div class="pts">${d.pts.toFixed(1)}</div></div></div>`;
  }).join('');
  return `<div class="pos"><h2>${pos}<span class="n">top 10</span></h2>${body}</div>`;
}).join('');

const defBody = DEF.map((d,i) => {
  const w = Math.max(6, (d.dst/maxDst)*100);
  const top = i<5 ? ' top' : '';
  const pill = i<5 ? '<span class="pill">PICK</span>' : '';
  return `<div class="row${top}"><div class="rank">${i+1}</div>
    <div class="cell"><div class="bar" style="width:${w}%"></div>
    <div class="lab"><span class="name">${d.team}</span><span class="opp">vs ${d.opp} &middot; ${d.pa} imp</span>${pill}</div>
    <div class="pts">${d.dst.toFixed(1)}</div></div></div>`;
}).join('');

const offRows = RECAP.off.map(r =>
  `<tr><td><b>${r.w}</b></td><td class="r">${r.n}</td><td class="r">${r.mae.toFixed(2)}</td>
   <td class="r"><b>${r.rho.toFixed(3)}</b></td><td class="r">${r.tr3.toFixed(3)}</td><td class="r">${r.last.toFixed(3)}</td></tr>`).join('');
const defRows = RECAP.def.map(r =>
  `<tr><td><b>${r.w}</b></td><td class="r">${r.n}</td><td class="r">${r.rho.toFixed(3)}</td>
   <td class="r"><b>+${r.gap.toFixed(2)}</b></td><td class="r">${r.top5.join(' / ')}</td></tr>`).join('');

app.innerHTML = `
<h1>2026 &mdash; Week 11 Board <span style="opacity:.55;font-weight:500">+ W8&ndash;10 recap</span></h1>
<div class="sub">ESPN Standard (non-PPR) &middot; W11 logged pre-kickoff 2026-11-17 00:12 &middot; 470 offense / 26 D/ST &middot; games Nov 19&ndash;22</div>

<div class="sec">The skipped weeks, scored (W8&ndash;10, replay-logged 2026-11-17)</div>
<div class="grid">
  <div class="card">
    <div class="hd">Offense &mdash; model vs baselines</div>
    <div class="kpi"><span class="v good">+0.701</span><span class="l">W10 Spearman (n=299)</span></div>
    <table style="margin-top:6px"><tr><th></th><th class="r">n</th><th class="r">MAE</th><th class="r">&rho; model</th><th class="r">&rho; tr3</th><th class="r">&rho; last</th></tr>

    <table style="margin-top:6px"><tr><th></th><th class="r">n</th><th class="r">&rho; board</th><th class="r">top-5 gap</th><th class="r">top-5 act. ranks</th></tr>
      ${defRows}
    </table>
    <div class="sub" style="margin:6px 0 0">Three straight weeks of positive gap &mdash; w8 +7.15, w9 +6.72, w10 +3.91. W10: board #1 LA (vs ARI) went 19.0 pts, actual rank 1; W8's board #1 CIN was actual rank 1 (allowed 6). Gap trend: ${RECAP.trend.def}</div>
  </div>
</div>

${offBlocks}

<div class="sec">Week 11 &mdash; D/ST Board (all 26)</div>
${defBody}

<div class="note">
  <b>Offense:</b> frozen pre-2026 model (V6: usage shares + prior-season bridge; retrained 2026-10-22 after the A/B win) &mdash; no re-training this week. W11 logged from the scheduled-panel path at 2026-11-17 00:12, before any kickoff. DAL stacks the board again (Prescott QB1, Lamb WR1, Pickens WR4), CHI clusters (Williams QB3, Swift RB5, Loveland TE1), SF (McCaffrey RB4, Evans WR5, Kittle TE3) and BUF (Allen QB2, Kincaid TE4) follow.
  <br><br>
  <b>D/ST method (shipped, A/B'd):</b> rank by the OPPONENT&rsquo;s Vegas implied team total, lowest first &mdash; the matchup, not the team, drives D/ST points. A/B on 2024+25 (2025 clean holdout): Spearman <b>+0.345</b>, beating the best own-defense/turnover model (+0.336). ESPN Standard D/ST tier on projected points allowed (0&ndash;6:+10, 7&ndash;13:+7, 14&ndash;17:+4, 18&ndash;23:+1, 24&ndash;30:0, 31+:&minus;1) + flat league-mean sacks (~2.4) and turnovers (~1.0) &mdash; those two set the absolute value, not the ranking.
  <br><br>
  <b>W11 D/ST picks:</b> KC (12.5 imp, vs ARI &mdash; the slate&rsquo;s weakest projected offense) tops the board alone in the +10 tier; BUF (14.5, vs MIA), DEN (15.2, vs LV), HOU (16.5, vs IND) and PIT (17.0, vs PHI) round out the top-5. Sits: TEN (31.5 imp, vs DAL &mdash; slate&rsquo;s strongest projected offense), MIA (31.0, vs BUF), NO (30.0, vs CHI), WAS (29.5, vs CIN), ARI (29.0, vs KC).
  <br><br>
  <b>Holdout status:</b> W8&ndash;10 were the skipped weeks &mdash; replay-logged 2026-11-17 with the frozen V6 model (features strictly prior-week; the log path never sees the target week&rsquo;s outcomes) and scored the same day. W9 (337) + W10 (299) offense, D/ST 30/28 (W10: 2 teams unscored &mdash; incomplete games). W11 offense (470) + D/ST (26) logged pre-kickoff 2026-11-17 00:12&ndash;00:14. Score after Sunday: <code>src.holdout</code> / <code>src.holdout_def --season 2026 --week 11 --score</code>.
</div>`;
</script>
</body>
</html>
