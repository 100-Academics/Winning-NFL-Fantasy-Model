[project]
name = "winning-nfl-fantasy-model"
version = "0.1.0"
description = "Per-player weekly NFL fantasy projection model (fantasy points + stat components)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "99-Academics" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "jupyter>=1.1",
    "pyarrow>=15.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
data = [
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.scripts]
# Wired up in Phase 5 once src/predict.py exists.
# predict = "src.predict:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.uv]
# Keep the interpreter pinned to a 3.11+ CPython build.
python-version = "3.11"
